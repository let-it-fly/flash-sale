services:
  postgres:
    image: postgres:18.6-alpine
    container_name: flash-sale-postgres
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: flashsale
      POSTGRES_DB: flashsale
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql


volumes:
  pg_data: